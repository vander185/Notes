plugins { id 'com.android.application' }

android {
    namespace 'io.github.vander185.claire'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.vander185.claire'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0'
        ndk { abiFilters 'arm64-v8a' }   // téléphones récents uniquement : appli plus légère
    }
    buildTypes {
        release { minifyEnabled false }   // signature faite à part, avec la clé de l'appli
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }   // bibliothèques compressées : pas besoin d'alignement spécial
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    // reconnaissance du mot « Claire » sur le téléphone, sans internet (Vosk, licence Apache 2.0)
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
