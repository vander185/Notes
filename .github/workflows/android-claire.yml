# Construit l'appli Android « Claire » (non signée) quand le dossier android-claire/ change.
# Le modèle de reconnaissance du mot « Claire » (Vosk français, Apache 2.0) est téléchargé ici, pas stocké dans le dépôt.
name: android-claire
on:
  push:
    paths: ['android-claire/**', '.github/workflows/android-claire.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: modèle français (Vosk small fr 0.22)
        run: |
          curl -sSL -o /tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          unzip -q /tmp/m.zip -d /tmp/m
          A=android-claire/app/src/main/assets/model-fr
          mkdir -p "$A" && cp -r /tmp/m/vosk-model-small-fr-0.22/* "$A"/
          rm -rf "$A"/rescore "$A"/rnnlm
          echo "fr-small-0.22-${GITHUB_SHA::7}" > "$A"/uuid
          du -sh "$A"
      - run: gradle -p android-claire assembleRelease --no-daemon --stacktrace
      - name: publier sur la branche apk-claire
        run: |
          mkdir /tmp/out && cp android-claire/app/build/outputs/apk/release/*.apk /tmp/out/claire-unsigned.apk
          cd /tmp/out && git init -q -b apk-claire && git add claire-unsigned.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK Claire non signé ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-claire
