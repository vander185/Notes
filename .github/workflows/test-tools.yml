name: test-tools
on:
  push:
    paths: ['tools/test_tools.mjs', 'tools/claire_app.js', '.github/workflows/test-tools.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/test_tools.mjs
