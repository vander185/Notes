# Construit l'appli Android (non signée) quand le dossier android/ change.
# La signature se fait ensuite à part, avec la clé de l'appli (jamais mise dans ce dépôt public).
name: android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: notes-unsigned
          path: android/app/build/outputs/apk/release/*.apk
