# Construit l'appli Android (non signée) quand le dossier android/ change.
# La signature se fait ensuite à part, avec la clé de l'appli (jamais mise dans ce dépôt public).
name: android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: notes-unsigned
          path: android/app/build/outputs/apk/release/*.apk
      # copie aussi l'APK non signé sur la branche apk-build (pour la signature à part)
      - name: publier sur la branche apk-build
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/release/*.apk /tmp/out/notes-unsigned.apk
          cd /tmp/out && git init -q -b apk-build && git add notes-unsigned.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK non signé ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
